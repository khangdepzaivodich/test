<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farewell</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #e0d8c8;
      overflow: hidden;
    }

    /* Ambient background gradient */
    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(120, 80, 160, 0.15), transparent),
        radial-gradient(ellipse 50% 60% at 80% 20%, rgba(80, 140, 200, 0.12), transparent),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(200, 160, 100, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(200, 180, 150, 0.4);
      border-radius: 50%;
      animation: float linear infinite;
      opacity: 0;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Main card */
    .farewell-card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
      background: rgba(20, 18, 30, 0.6);
      border: 1px solid rgba(200, 180, 150, 0.12);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      animation: card-appear 1.2s ease-out;
    }

    @keyframes card-appear {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Decorative line */
    .ornament {
      display: inline-block;
      margin: 0 auto 1.5rem;
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 180, 150, 0.5), transparent);
    }

    .farewell-card h1 {
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #f0e8d8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .farewell-card .subtitle {
      font-size: 0.95rem;
      color: rgba(200, 180, 150, 0.6);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .farewell-card .message {
      font-size: 1.1rem;
      line-height: 1.7;
      color: rgba(224, 216, 200, 0.85);
      margin-bottom: 2rem;
      font-style: italic;
    }

    .farewell-card .signature {
      font-size: 0.95rem;
      color: rgba(200, 180, 150, 0.5);
      letter-spacing: 0.05em;
      margin-bottom: 2.5rem;
    }

    .farewell-card .signature span {
      display: inline-block;
      margin: 0 0.3rem;
      color: rgba(200, 180, 150, 0.7);
    }

    /* Button */
    .farewell-btn {
      display: inline-block;
      padding: 0.75rem 2.2rem;
      border: 1px solid rgba(200, 180, 150, 0.25);
      border-radius: 6px;
      background: rgba(200, 180, 150, 0.06);
      color: #d0c8b8;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .farewell-btn:hover {
      background: rgba(200, 180, 150, 0.12);
      border-color: rgba(200, 180, 150, 0.4);
      color: #f0e8d8;
      transform: translateY(-1px);
    }

    /* Fade-out on click */
    .farewell-card.fade-out {
      animation: card-fade 0.8s ease-in forwards;
    }

    @keyframes card-fade {
      to { opacity: 0; transform: translateY(10px) scale(0.96); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .farewell-card {
        padding: 2rem 1.5rem;
      }
      .farewell-card h1 {
        font-size: 1.8rem;
      }
      .farewell-card .message {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="particles" id="particles"></div>

  <div class="farewell-card" id="card">
    <div class="ornament"></div>
    <h1>Farewell</h1>
    <div class="subtitle">Until we meet again</div>
    <p class="message">
      This is not the end — only a pause between chapters.
      Thank you for everything.
    </p>
    <div class="signature">
      <span>~</span> With gratitude <span>~</span>
    </div>
    <button class="farewell-btn" id="btn">Close</button>
  </div>

  <script>
    // Generate floating particles
    (function createParticles() {
      const container = document.getElementById('particles');
      const count = 30;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left     = Math.random() * 100 + '%';
        p.style.width    = (1 + Math.random() * 2) + 'px';
        p.style.height   = p.style.width;
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay    = (Math.random() * 10) + 's';
        container.appendChild(p);
      }
    })();

    // Button handler
    document.getElementById('btn').addEventListener('click', function () {
      const card = document.getElementById('card');
      card.classList.add('fade-out');
      setTimeout(() => { window.close(); }, 800);
    });
  </script>
</body>
</html>
